# genre_words と signal_words の両方に1語以上マッチした記事だけ候補にする
genre_words: [カフェ, スイーツ, コーヒー, パンケーキ, パフェ, 喫茶, ベーカリー, 抹茶, チョコレート,
              ケーキ, ドーナツ, クレープ, タルト, ジェラート, かき氷, 焼き菓子, ラテ, エスプレッソ]
signal_words: [オープン, 開業, 開店, ポップアップ, POP-UP, POPUP, 期間限定, 催事, フェス, フェア,
               新店, 1号店, 初出店, 上陸, 限定ストア, 限定オープン]
area_words: [東京, 渋谷, 新宿, 銀座, 表参道, 自由が丘, 吉祥寺, 池袋, 蔵前, 中目黒, 下北沢, 都内]
sources:
  # PR TIMESは全件フィードのみ提供（カテゴリ別RSSは存在しない）。
  # 最新200件＝当日分しか保持しないため、2時間おきに取得して蓄積する。
  - name: prtimes_all
    url: https://prtimes.jp/index.rdf

# GoogleニュースRSS（クエリ指定で購読可能）。Fashion Press・Time Out・
# レッツエンジョイ東京・WWDなど、直接RSSを出していない媒体の記事をここで拾う。
# 1クエリあたり最大100件返る。
google_news_queries:
  - 東京 カフェ オープン
  - 東京 パンケーキ 新店
  - 東京 コーヒースタンド オープン
  - 東京 ベーカリー オープン
  - 東京 ポップアップ スイーツ
  - 東京 スイーツフェス 催事
  - 東京 期間限定 カフェ
